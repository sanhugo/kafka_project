spring:

  application:
    name: order_processor
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: processor-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ru.sanhugo.common"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        retry.backoff.ms: 150
        max.in.flight.requests.per.connection: 1

    listener:
      ack-mode: manual
  datasource:
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5434}/${PG_NAME:shop}
    username: ${PG_USER:shop}
    password: ${PG_PASS}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml
logging:
  config: classpath:logback-spring.xml
