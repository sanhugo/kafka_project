spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

  datasource:
    # Use in-memory H2 instead of PostgreSQL
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 3. Disable Liquibase for tests (so migrations do not run on every test)
  liquibase:
    enabled: false

# 4. Fully disable the Loki logger for tests to get rid of ConnectException spam
logging:
  level:
    com.github.loki4j: OFF