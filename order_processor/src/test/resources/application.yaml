spring:
  profiles:
    active: test
  autoconfigure:
    exclude:
      - org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

  datasource:
    # Используем H2 в памяти вместо PostgreSQL
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 3. Отключаем Liquibase для тестов (чтобы не гонять миграции при каждом тесте)
  liquibase:
    enabled: false

# 4. Полностью отключаем логгер Loki для тестов, чтобы убрать спам ConnectException
logging:
  level:
    com.github.loki4j: OFF