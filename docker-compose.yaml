services:
  shop:
    image: postgres:17
    container_name: shop
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  shop_kafka:
    image: apache/kafka:latest
    container_name: shop_kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@shop_kafka:9093
      # PLAINTEXT is for containers in the docker network, HOST is for applications running on the host (IDE)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://shop_kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Store data in the mounted kafka-data volume (the image default is /tmp, which is lost on recreate)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      shop:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 15s
      # the check starts a JVM, so 5s is not enough when the machine is busy (e.g. during a build)
      timeout: 30s
      retries: 10
      start_period: 30s

  loki_app:
    image: grafana/loki:3.0.0
    container_name: loki_app
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    networks:
      default:
        # Loki4j parses the URL with java.net.URI, which does not accept "_" in a host name
        aliases:
          - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: my_admin
      GF_SECURITY_ADMIN_PASSWORD: MySecurePassword123
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: "Asia/Irkutsk"
    depends_on:
      - loki_app
    volumes:
      - grafana-data:/var/lib/grafana

  # === ORDER_PROCESSOR: connects to the DB and Kafka ===
  order_processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order_processor
    image: order_processor:latest
    container_name: order_processor
    depends_on:
      shop:
        condition: service_healthy
      shop_kafka:
        condition: service_healthy
      loki_app:
        condition: service_started
    environment:
      PG_HOST: shop
      PG_PORT: "5432"
      PG_NAME: shop
      PG_USER: shop
      PG_PASS: shop
      KAFKA_BOOTSTRAP: shop_kafka:9092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_APPLICATION_NAME: order_processor

  order_producer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: order_producer
    image: order_producer:latest
    container_name: order_producer
    depends_on:
      shop_kafka:
        condition: service_healthy
      loki_app:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: shop_kafka:9092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_APPLICATION_NAME: order_producer

  dlq_handler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: dlq_handler
    image: dlq_handler:latest
    container_name: dlq_handler
    depends_on:
      shop_kafka:
        condition: service_healthy
      loki_app:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: shop_kafka:9092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      SPRING_APPLICATION_NAME: dlq_handler

volumes:
  kafka-data:
    driver: local
  loki-data:
    driver: local
  grafana-data:
    driver: local
  postgres_data:
    driver: local